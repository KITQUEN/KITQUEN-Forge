[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kitquen-forge"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local MCP server and Kitlean 3D language for KITQUEN Forge"
license = {text = "MIT"}
dependencies = ["mcp>=1.28,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
bench = ["tiktoken>=0.8"]

[project.scripts]
kitquen-forge-mcp = "forge_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["forge_mcp", "kitquen_forge", "kitquen_forge.language"]
exclude = ["kitquen_forge.tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
